[project]
name = "techradar"
version = "0.1.0"
description = "Personal tech intelligence radar: collect, dedupe, rank, remember, digest."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx[socks]>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "apscheduler>=3.10,<4",
    "python-dateutil>=2.9",
    "tenacity>=8.3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
bot = ["python-telegram-bot>=21"]
web = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
techradar = "techradar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["techradar"]

[tool.ruff]
line-length = 100
target-version = "py312"
